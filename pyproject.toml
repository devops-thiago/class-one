[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "classone"
version = "0.1.0"
description = "Open-source System 1 decision model architecture built on Gemma 4 E2B"
readme = "README.md"
authors = [{ name = "Thiago" }]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "accelerate>=0.21.0",
    "numpy>=1.26.0",
]

[project.urls]
Repository = "https://github.com/midgardsys/class-one"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["UP007", "E501"]

