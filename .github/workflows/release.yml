name: Release

on:
  release:
    types: [published]

# Principle of least privilege: every job opts into only what it needs.
permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Verify README heads SHA256 match Hugging Face Hub before release
        env:
          PYTHONPATH: src
        run: uv run --no-project --python 3.11 --with huggingface_hub python scripts/verify_hub_heads_sha.py

      - name: Build sdist and wheel
        run: uv build

      - name: Validate distribution metadata
        run: uvx twine check dist/*

      - name: GPG Detached Sign Python Packages (if GPG key provided)
        env:
          GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY || secrets.MAVEN_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE || secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          if [ -n "${GPG_KEY}" ]; then
            echo "${GPG_KEY}" | gpg --batch --import
            for f in dist/*; do
              gpg --batch --yes --armor --pinentry-mode loopback --passphrase "${GPG_PASSPHRASE}" --detach-sign "$f"
            done
          fi

      - name: Attest Python Distribution Provenance (Sigstore)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/classone
    permissions:
      id-token: write # OIDC token for PyPI trusted publishing
      contents: read
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
